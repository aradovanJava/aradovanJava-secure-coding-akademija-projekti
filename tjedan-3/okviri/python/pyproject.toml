[project]
name = "okviri"
version = "1.0.0"
description = "Tjedan 3: sigurnosni mehanizmi FastAPI-ja umjesto ručnih provjera iz Tjedna 2"
requires-python = ">=3.12"
authors = [{ name = "Aleksander Radovan" }]
# Ovisnosti su zaključane u requirements.txt i requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["okviri"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# S = pravila iz Bandita (flake8-bandit), B = bugbear, UP = moderna sintaksa
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
