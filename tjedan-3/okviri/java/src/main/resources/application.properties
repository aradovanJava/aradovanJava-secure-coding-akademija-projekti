spring.application.name=okviri
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never

# JWT od Keycloaka: potpis (JWKS s issuera), iss i aud provjerava Spring Security.
# Ključevi se dohvaćaju tek kod prvog tokena, pa aplikacija (i testovi) rade i bez pokrenutog Keycloaka.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/akademija
spring.security.oauth2.resourceserver.jwt.audiences=medtermin-api

# Isti ključ kao u T2 (app.cors.allowed-origins); više origina odvojite zarezom.
app.cors.allowed-origins=http://localhost:5173
# Lokalna prijava: najviše N pokušaja u minuti po IP adresi.
app.prijava.pokusaja-u-minuti=5
