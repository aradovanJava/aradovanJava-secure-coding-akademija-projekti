# Laboratorij 3. tjedna: Sigurnost baza podataka (SQL Server 2022 Developer)
# Pokretanje:   docker compose up -d
# Provjera:     docker compose --profile provjera run --rm provjera
# Demo:         docker compose --profile aplikacija run --rm aplikacija-python   (ili aplikacija-java, aplikacija-dotnet)
# Reset:        docker compose down -v   (pa ispraznite ./backup i ./audit)
name: sigurnost-baza

x-mssql-slika: &slika
  image: mcr.microsoft.com/mssql/server:2022-latest
  # Slika postoji samo za amd64; na Apple Siliconu uključite Rosettu u Docker Desktopu.
  platform: linux/amd64

x-okruzenje: &okruzenje
  DOMENA: ${DOMENA:-medtermin}
  MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Postavite MSSQL_SA_PASSWORD u datoteci .env (kopija .env.primjer)}
  ADMIN_LOGIN: ${ADMIN_LOGIN:-sa}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

services:
  # Jednokratno: mape ./backup i ./audit moraju biti zapisive korisniku mssql (uid 10001) u kontejneru.
  dozvole:
    <<: *slika
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chmod 0777 /var/opt/mssql/backup /var/opt/mssql/audit && echo 'Dozvole za ./backup i ./audit su postavljene.'"]
    volumes:
      - ./backup:/var/opt/mssql/backup
      - ./audit:/var/opt/mssql/audit
    restart: "no"

  sql:
    <<: *slika
    hostname: sql
    environment:
      <<: *okruzenje
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      # Samo lokalno računalo – poslužitelj nije dostupan s mreže.
      - "127.0.0.1:${SQL_PORT:-1433}:1433"
    volumes:
      - podaci:/var/opt/mssql
      - ./backup:/var/opt/mssql/backup
      - ./audit:/var/opt/mssql/audit
    depends_on:
      dozvole:
        condition: service_completed_successfully
    healthcheck:
      # Koristi ADMIN_LOGIN/ADMIN_PASSWORD (zadano: sa / MSSQL_SA_PASSWORD).
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$${ADMIN_PASSWORD:-$$MSSQL_SA_PASSWORD}\" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U \"$${ADMIN_LOGIN:-sa}\" -l 5 -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 20

  # Jednokratno: stvara bazu odabrane domene (samo ako još ne postoji).
  init:
    <<: *slika
    environment: *okruzenje
    entrypoint: ["/bin/bash", "/skripte/init.sh"]
    volumes:
      - ./skripte:/skripte:ro
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  # Automatska provjera zadataka: docker compose --profile provjera run --rm provjera
  provjera:
    <<: *slika
    profiles: ["provjera"]
    environment: *okruzenje
    entrypoint: ["/bin/bash", "/skripte/provjera.sh"]
    volumes:
      - ./skripte:/skripte:ro
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  # Demo „Aplikacija i baza” (README.md, odjeljak 5): ista provjera u tri tehnologije – spaja se kao aplikacija
  # (<domena>_app), postavlja SESSION_CONTEXT i ispisuje što aplikacijski račun smije. Ništa ne mijenja u bazi.
  #   docker compose --profile aplikacija run --rm aplikacija-python
  aplikacija-python:
    profiles: ["aplikacija"]
    build: ./aplikacija/python
    environment: &demo
      DOMENA: ${DOMENA:-medtermin}
      SQL_HOST: sql
      SQL_PORT: "1433"
      # Lozinke aplikacije i podrške nakon zadatka Z2.1 (prazno = zatečene lozinke iz postavljanja).
      APP_LOZINKA: ${APP_LOZINKA:-}
      PODRSKA_LOZINKA: ${PODRSKA_LOZINKA:-}
      DEMO_STROGO: ${DEMO_STROGO:-0}
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  #   docker compose --profile aplikacija run --rm aplikacija-java     (prvo pokretanje preuzima Maven ovisnosti)
  aplikacija-java:
    profiles: ["aplikacija"]
    image: maven:3.9-eclipse-temurin-21
    # Izvorni kod je samo za čitanje; prevodi se u kopiji u kontejneru (na disku ne ostaje target/).
    entrypoint: ["/bin/sh", "-c", "cp -r /izvor /tmp/app && cd /tmp/app && mvn -q -B compile exec:java"]
    environment: *demo
    volumes:
      - ./aplikacija/java:/izvor:ro
      - maven:/root/.m2
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  #   docker compose --profile aplikacija run --rm aplikacija-dotnet   (prvo pokretanje preuzima NuGet pakete)
  aplikacija-dotnet:
    profiles: ["aplikacija"]
    image: mcr.microsoft.com/dotnet/sdk:10.0
    entrypoint: ["/bin/sh", "-c", "cp -r /izvor /tmp/app && cd /tmp/app && dotnet run --nologo -v q"]
    environment:
      <<: *demo
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    volumes:
      - ./aplikacija/dotnet:/izvor:ro
      - nuget:/root/.nuget/packages
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

volumes:
  podaci:
  maven:
  nuget:
