name: t4-demo-knjiznica

on:
  push:
    paths:
      - "tjedan-4/demo-knjiznica/**"
      - ".github/workflows/t4-demo.yml"
  workflow_dispatch:

jobs:
  provjera:
    name: ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [java, dotnet, python]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.stack == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.stack == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ranjiva verzija (crveno) i rješenje (zeleno)
        run: bash tjedan-4/demo-knjiznica/ci/provjeri.sh ${{ matrix.stack }}

  paket:
    name: ZIP za polaznike
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tjedan-4/demo-knjiznica/generiraj.py --paket dist
      - uses: actions/upload-artifact@v4
        with:
          name: knjiznica-demo
          path: dist/knjiznica-demo.zip
