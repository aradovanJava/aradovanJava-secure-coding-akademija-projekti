name: t3-devsecops
# Test DevSecOps predloška (tjedan-3/devsecops): T2 projekt medtermin u stanju all-secure i all-vuln
# + predložak -> isti ci/*.sh koraci kao kod polaznika -> gate mora PROĆI (secure) odnosno PASTI (vuln).
on:
  push:
    branches: [main]
    paths: ['tjedan-3/devsecops/**', '.github/workflows/t3-devsecops.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predlozak:
    strategy:
      fail-fast: false
      matrix:
        stack: [java, dotnet, python]
        mode: [all-secure, all-vuln]
    runs-on: ubuntu-latest
    name: ${{ matrix.stack }}/medtermin ${{ matrix.mode }}
    defaults:
      run:
        working-directory: /tmp/t3-projekt
    steps:
      - uses: actions/checkout@v5
      - if: matrix.stack == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'templates/java/medtermin/pom.xml'
      - if: matrix.stack == 'dotnet'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Python projekt: isti Python kao u predlošku cjevovoda (devsecops/python/.github/workflows)
      - if: matrix.stack == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'templates/python/medtermin/requirements*.txt'
      - name: Diff ci/ java vs dotnet vs python (skripte moraju biti iste)
        working-directory: ${{ github.workspace }}
        run: |
          diff -r -x prihvaceno.txt tjedan-3/devsecops/java/ci tjedan-3/devsecops/dotnet/ci
          diff -r -x prihvaceno.txt tjedan-3/devsecops/java/ci tjedan-3/devsecops/python/ci
      - name: Generiraj projekt + predložak
        working-directory: ${{ github.workspace }}
        run: tjedan-3/devsecops/test/pripremi.sh ${{ matrix.stack }} medtermin ${{ matrix.mode }} "/tmp/t3-projekt"
      - name: Build, testovi, pokrivenost
        run: bash ci/build-test.sh
      - name: SAST
        if: always()
        run: bash ci/sast.sh
      - name: SCA
        if: always()
        run: bash ci/sca.sh
      - name: Tajne
        if: always()
        run: bash ci/secrets.sh
      - name: DAST
        if: always()
        run: bash ci/dast.sh
      - name: Sigurnosna vrata
        id: gate
        if: always()
        continue-on-error: true
        run: python3 ci/gate.py
      - name: Provjera očekivanja (${{ matrix.mode }})
        if: always()
        working-directory: ${{ github.workspace }}
        run: python3 tjedan-3/devsecops/test/provjeri.py --stack ${{ matrix.stack }} --mode ${{ matrix.mode }} --gate "/tmp/t3-projekt/izvjestaji/gate.json"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: t3-${{ matrix.stack }}-${{ matrix.mode }}
          path: /tmp/t3-projekt/izvjestaji/
          if-no-files-found: warn
