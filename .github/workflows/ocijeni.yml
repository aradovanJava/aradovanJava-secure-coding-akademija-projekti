name: ocijeni
# Ocjenjivanje predaje skrivenim testovima: Actions → ocijeni → Run workflow.
on:
  workflow_dispatch:
    inputs:
      predaja:
        description: 'Datoteka u mapi predaje/ (npr. V07-Ime-Prezime.zip); "*" = sve'
        required: true
      variant:
        description: 'Varijanta (prazno = iz naziva datoteke)'
        required: false
        default: ''
      stack:
        description: 'auto | java | dotnet | python'
        required: false
        default: 'auto'
jobs:
  ocijeni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'templates/java/**/pom.xml'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Ocjenjivanje
        env:
          PREDAJA: ${{ github.event.inputs.predaja }}
          VARIANT: ${{ github.event.inputs.variant }}
          STACK: ${{ github.event.inputs.stack }}
        run: |
          mkdir -p izvjestaji
          if [ "$PREDAJA" = "*" ]; then files=$(ls predaje/*.zip); else files="predaje/$PREDAJA"; fi
          for f in $files; do
            args=(--predaja "$f" --stack "${STACK:-auto}" --out "izvjestaji/$(basename "${f%.zip}").md")
            [ -n "$VARIANT" ] && args+=(--variant "$VARIANT")
            python3 tools/ocijeni.py "${args[@]}" || echo "::error::Ocjenjivanje nije uspjelo za $f"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: izvjestaji
          path: izvjestaji/
