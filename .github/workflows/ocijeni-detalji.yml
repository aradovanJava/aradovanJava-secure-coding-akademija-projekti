name: ocijeni-detalji
# Detaljno ocjenjivanje (tools/ocijeni_detalji.py): poruke palih skrivenih testova, vlastita pokrivenost,
# crveno → zeleno za sve testne datoteke polaznika (i u paketu primjer), početna pokrivenost izvorne varijante.
on:
  workflow_dispatch:
    inputs:
      predaje:
        description: 'JSON lista datoteka u predaje/, npr. ["V01-Ime-Prezime.zip"]'
        required: true
      stack:
        description: 'auto | java | dotnet | python'
        required: false
        default: 'auto'
jobs:
  detalji:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        predaja: ${{ fromJSON(github.event.inputs.predaje) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'templates/java/**/pom.xml'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Detalji
        run: python3 tools/ocijeni_detalji.py --predaja "predaje/${{ matrix.predaja }}" --stack "${{ github.event.inputs.stack }}"
